# ============================================================================
# PREFIX KEY CONFIGURATION
# ============================================================================

# Change prefix from C-b to C-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix


# ============================================================================
# GENERAL BEHAVIOR
# ============================================================================

# Timing settings
set -sg escape-time 50               # Delay so split escape seqs from TUIs (Claude Code, nvim) fully arrive before parse; too low -> duplicate/ghost input box on long sessions
set -g repeat-time 300               # Time for repeatable commands
set -g history-limit 250000          # Scrollback buffer size (Claude Code scrolls a lot of output)
set -g assume-paste-time 1           # Treat fast input as paste, not keystrokes -> avoid input-box redraw thrash on big pastes

# Input and interaction
set -g mouse on                      # Enable mouse support
set -g focus-events on               # Send focus events to applications
set -g mode-keys vi                  # Vi-style keys in copy mode
set -g status-keys vi                # Vi-style keys in status line
set -g detach-on-destroy off         # Switch to another session instead of detaching


# ============================================================================
# WINDOW AND PANE INDEXING
# ============================================================================

set -g base-index 1                  # Start window numbering at 1
setw -g pane-base-index 1            # Start pane numbering at 1
set -g renumber-windows on           # Renumber windows when one is closed
setw -g aggressive-resize on         # Resize based on smallest active client


# ============================================================================
# DISPLAY AND TERMINAL SETTINGS
# ============================================================================

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"          # Enable true color support
set -as terminal-features ",*:sync"         # Synchronized output (DCS 2026) so TUIs (Claude Code, nvim) paint frames atomically -> no tearing/garbled redraws
set -as terminal-features ",*:clear"        # Use real clear-screen; stops stale input box lingering as ghost over long sessions
set -as terminal-features ",*:extkeys"      # Outer terminal (WezTerm) supports extended keys
set -s extended-keys on                     # Actually forward extended keys to apps inside tmux (Claude Code Shift+Enter etc.); terminal-features alone only advertises outer support
set -gq allow-passthrough on                # Allow image rendering (image.nvim)

# Refresh terminal-identity env vars on each client attach. Without this, the
# terminal that first STARTED the tmux server (e.g. WezTerm) leaks WEZTERM_*/
# TERM_PROGRAM into the global server env; every pane inherits them even when
# re-attached from kitty. yazi's brand detection then sees WEZTERM_EXECUTABLE,
# forces the iTerm2 image protocol (Iip), and kitty -- which only speaks the
# kitty graphics protocol (KGP) -- shows a blank preview. Listing these vars
# makes tmux re-sync them from the attaching client (and unset stale ones in
# new panes), so yazi detects the live terminal.
set -ga update-environment " TERM_PROGRAM WEZTERM_EXECUTABLE WEZTERM_EXECUTABLE_DIR WEZTERM_PANE WEZTERM_UNIX_SOCKET WEZTERM_CONFIG_DIR WEZTERM_CONFIG_FILE KITTY_WINDOW_ID KITTY_PID KITTY_PUBLIC_KEY"

# Redraw stability for long-lived TUIs (Claude Code): full status redraw can race the
# TUI input-box repaint -> overlapping/ghost box. Slower status refresh shrinks the race window.

# Status bar position
set-option -g status-position top

# Display timing
set -g display-time 2000             # Message display duration (ms)
set -g display-panes-time 2000       # Pane number display duration (ms)
set -g status-interval 15            # Status bar refresh interval (s); higher -> fewer full-row redraws racing Claude Code's input-box repaint (cause of ghost/double box)

# Window title and activity
set -g set-titles off                # Don't set terminal title
set -g visual-activity off           # Don't show visual activity indicators
set -g visual-bell off               # Don't show visual bell
set -g monitor-activity on           # Monitor activity in windows

# ============================================================================
# KEY BINDINGS - CONFIGURATION
# ============================================================================

# Reload configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Toggle status bar visibility
bind-key t set-option status


# ============================================================================
# KEY BINDINGS - WINDOWS
# ============================================================================

# Create new window with custom name prompt
bind-key c command-prompt -p "Window name:" "new-window -n '%%' -c '#{pane_current_path}'"

# Navigate windows by number (Alt+1-9, no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Navigate windows with Alt+{ / Alt+} (macOS-style, like Cmd+Shift+[/] in browsers)
bind -n "M-{" previous-window
bind -n "M-}" next-window

# Move windows left/right with Ctrl+Shift+Arrow (no prefix needed)
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# New window (Cmd+T-style)
bind -n M-t new-window -c "#{pane_current_path}"

# Close pane (Cmd+W-style)
bind -n M-w kill-pane

# Reload config (Cmd+R-style)
bind -n M-r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ============================================================================
# KEY BINDINGS - PANES (CREATION AND SPLITS)
# ============================================================================

# Split panes with custom title prompts
bind-key | split-window -h -c "#{pane_current_path}" \; command-prompt -p "Pane title:" "select-pane -T '%%'"
bind-key - split-window -v -c "#{pane_current_path}" \; command-prompt -p "Pane title:" "select-pane -T '%%'"


# ============================================================================
# KEY BINDINGS - PANES (NAVIGATION)
# ============================================================================

# Navigate panes with Alt+hjkl (no prefix needed, supplements vim-tmux-navigator)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Navigate panes with prefix+hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# ============================================================================
# KEY BINDINGS - PANES (RESIZING)
# ============================================================================

# Resize panes with prefix+HJKL (capital letters)
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5


# ============================================================================
# KEY BINDINGS - PANES (MANAGEMENT)
# ============================================================================

# Kill panes and windows with confirmation
bind-key x confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind-key X confirm-before -p "Kill window #W? (y/n)" kill-window
bind-key C-x confirm-before -p "Kill all other panes? (y/n)" "kill-pane -a"

# Layout management
bind-key Space next-layout
bind-key = select-layout even-horizontal
bind-key + select-layout even-vertical

# Mark and swap panes
bind-key m select-pane -m
bind-key M swap-pane
bind-key > swap-pane -D
bind-key < swap-pane -U

# Synchronize panes (send input to all panes in window)
bind-key y set-window-option synchronize-panes\; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# Popup windows
bind-key g display-popup -E -w 80% -h 80% "lazygit"
bind-key G display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"

# ============================================================================
# KEY BINDINGS - SESSIONS
# ============================================================================

# Session management
bind-key S choose-session
bind-key w choose-tree -Zs
bind-key a display-popup -E -w 96% -h 94% "~/.tmux/tmux-agents"
bind-key N command-prompt -p "New session:" "new-session -s '%%'"
bind-key R command-prompt -p "Rename session:" "rename-session '%%'"
bind-key n display-popup -E -w 80% -h 80% "~/.local/bin/tmux-project"

# ============================================================================
# KEY BINDINGS - COPY MODE (VI-STYLE)
# ============================================================================

# Enter copy mode
bind-key v copy-mode
bind-key / copy-mode \; send-keys ?

# Paste from buffer
bind-key p paste-buffer

# Selection bindings in copy mode
unbind-key -T copy-mode-vi Space
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy to system clipboard (macOS)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'


# ============================================================================
# PLUGIN MANAGER (TPM)
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'



# ============================================================================
# PLUGINS - NAVIGATION AND UTILITIES
# ============================================================================

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Fuzzy finder settings
set -g @tmux-fzf-launch-key 'C-f'


# ============================================================================
# THEME - MINIMALIST KANAGAWA
# ============================================================================

# Kanagawa wave colors (only colors used in this config)
%hidden KANA_VIOLET="#957FB8"   # springViolet  (accent / pane_current_command)
%hidden KANA_ORANGE="#FFA066"   # surimiOrange  (cpu)
%hidden KANA_YELLOW="#E6C384"   # carpYellow    (battery / activity)
%hidden KANA_GREEN="#98BB6C"    # springGreen   (session)
%hidden KANA_BLUE="#7E9CD8"     # crystalBlue   (active window accent)
%hidden KANA_LAVENDER="#7FB4CA" # springBlue    (active window name)
%hidden KANA_TEXT="#DCD7BA"     # fujiWhite     (default fg / time)
%hidden KANA_SUBTEXT="#C8C093"  # oldWhite      (subtext)
%hidden KANA_GRAY="#727169"     # fujiGray      (inactive windows)
%hidden KANA_OVERLAY="#54546D"  # sumiInk4      (separators)
%hidden KANA_RED="#E82424"      # samuraiRed    (blocked agent)
%hidden KANA_SELECTION="#2A2A37" # sumiInk3     (selected agent)

# Status bar styling - transparent background
set -g status-style "bg=default,fg=#{KANA_TEXT}"

# ============================================================================
# STATUS BAR CONFIGURATION
# ============================================================================

# Status bar dimensions
set -g status-right-length 150
set -g status-left-length 100

# Left status - empty
set -g status-left ""

# Window status - minimalist style (no backgrounds)
set -g window-status-format "#[bg=default,fg=#{KANA_GRAY}]#I #W"
set -g window-status-current-format "#[bg=default,fg=#{KANA_BLUE},bold]#I #[bg=default,fg=#{KANA_LAVENDER}]#W"
set -g window-status-activity-style "bg=default,fg=#{KANA_YELLOW}"
set -g window-status-separator "  "

# Right status - minimalist with icons and colored text
# Format: application │ cpu │ session │ battery │ time
set -g status-right "\
#[fg=#{KANA_VIOLET}] #{pane_current_command} \
#[fg=#{KANA_OVERLAY}]│ \
#[fg=#{KANA_ORANGE}]󰻠 #{cpu_percentage} \
#[fg=#{KANA_OVERLAY}]│ \
#[fg=#{KANA_GREEN}]󰣇 #S \
#[fg=#{KANA_OVERLAY}]│ \
#[fg=#{KANA_YELLOW}]#{battery_icon} #{battery_percentage} \
#[fg=#{KANA_OVERLAY}]│ \
#[fg=#{KANA_SUBTEXT}] %I:%M %p"


# ============================================================================
# WINDOW NAMING BEHAVIOR
# ============================================================================
# NOTE: These settings must come after plugins to prevent being overridden

# Preserve manual window names
setw -g automatic-rename off
set-option -g allow-rename off


# ============================================================================
# PLUGIN INITIALIZATION (must be at the very bottom)
# ============================================================================

run '~/.tmux/plugins/tpm/tpm'
